name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Rebuild and check JavaScript
        run: npm run check

      - name: Validate migrations on a fresh database
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          con = sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              con.executescript(path.read_text())
              print('applied', path.name)
          print('all migrations applied successfully')
          PY

  fresh-install-neutrality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify domain-neutral fresh defaults
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          con = sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              con.executescript(path.read_text())

          active_purposes = sorted(
              row[0] for row in con.execute(
                  "SELECT id FROM app_purposes_v2 WHERE active=1 ORDER BY id"
              )
          )
          legacy_active = sorted(
              row[0] for row in con.execute(
                  "SELECT id FROM app_purposes_v2 WHERE active=1 AND id IN ('APT','BUS','PAT','OTH') ORDER BY id"
              )
          )
          holiday_rows = list(
              con.execute('SELECT date,name FROM app_holidays_v2 ORDER BY date')
          )

          print('active purposes:', active_purposes)
          print('legacy active purposes:', legacy_active)
          print('fresh holiday rows:', holiday_rows)

          required = {'MEETING', 'VISIT', 'TASK', 'TRAVEL'}
          missing = required.difference(active_purposes)
          if missing:
              raise SystemExit(f'missing generic starter purposes: {sorted(missing)}')
          if legacy_active:
              raise SystemExit(f'legacy domain-specific purposes are active: {legacy_active}')
          if holiday_rows:
              raise SystemExit(f'fresh install contains locale-specific holidays: {holiday_rows}')

          print('fresh-install defaults are domain-neutral')
          PY
